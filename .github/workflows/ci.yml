name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build packages
        run: bun run build

      - name: Cache ESLint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('**/package.json', 'eslint.config.*') }}
          restore-keys: |
            eslint-${{ runner.os }}-

      - name: Lint
        run: bun run lint

  # A separate job so a test failure does not hide lint errors (and vice versa).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build packages
        run: bun run build

      # Package tests via turbo (packages/* only, so docs is not rebuilt):
      # bun test for the CLI (including `please-style check`) and
      # ast-grep-config, plus ast-grep-config's ast-grep rule tests. The
      # runner's cargo enables the real
      # `cargo metadata` test. ast-grep resolves from
      # node_modules/.bin (root trustedDependencies runs @ast-grep/cli's
      # postinstall, which links the native binary).
      - name: Test
        run: bun run test
