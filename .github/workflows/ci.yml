name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Installs node + bun at the versions pinned in mise.toml
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install dependencies
        run: bun install

      - name: Build packages
        run: bun run build

      - name: Cache ESLint
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('**/package.json', 'eslint.config.*') }}
          restore-keys: |
            eslint-${{ runner.os }}-

      - name: Lint
        run: bun run lint

  # A separate job so a test failure does not hide lint errors (and vice versa).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Installs node + bun at the versions pinned in mise.toml
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install dependencies
        run: bun install

      - name: Build packages
        run: bun run build

      # Package tests via turbo (packages/* only, so docs is not rebuilt):
      # bun test for the CLI (including `please-style check`) and
      # ast-grep-config, plus ast-grep-config's ast-grep rule tests. The
      # runner's cargo enables the real
      # `cargo metadata` test. ast-grep resolves from
      # node_modules/.bin (root trustedDependencies runs @ast-grep/cli's
      # postinstall, which links the native binary).
      - name: Test
        run: bun run test
