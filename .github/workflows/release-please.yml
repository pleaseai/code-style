name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      eslint-config-released: ${{ steps.release.outputs['packages/eslint-config--release_created'] }}
      prettier-config-released: ${{ steps.release.outputs['packages/perttier-config--release_created'] }}
      code-style-released: ${{ steps.release.outputs['packages/cli--release_created'] }}
    steps:
      - uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance / trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # npm CLI is the publisher: bun publish supports neither npm OIDC
      # trusted publishing nor --provenance (oven-sh/bun#22423). setup-node
      # provisions the registry .npmrc and an npm new enough for provenance.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Publish @pleaseai/eslint-config
        if: ${{ needs.release-please.outputs.eslint-config-released == 'true' }}
        working-directory: packages/eslint-config
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@pleaseai/eslint-config@$VERSION" version 2>/dev/null; then
            echo "⚠ @pleaseai/eslint-config@$VERSION already published, skipping"
          else
            bun pm pack
            npm publish pleaseai-eslint-config-*.tgz --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @pleaseai/prettier-config
        if: ${{ needs.release-please.outputs.prettier-config-released == 'true' }}
        working-directory: packages/perttier-config
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@pleaseai/prettier-config@$VERSION" version 2>/dev/null; then
            echo "⚠ @pleaseai/prettier-config@$VERSION already published, skipping"
          else
            bun pm pack
            npm publish pleaseai-prettier-config-*.tgz --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @pleaseai/code-style
        if: ${{ needs.release-please.outputs.code-style-released == 'true' }}
        working-directory: packages/cli
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@pleaseai/code-style@$VERSION" version 2>/dev/null; then
            echo "⚠ @pleaseai/code-style@$VERSION already published, skipping"
          else
            bun pm pack
            npm publish pleaseai-code-style-*.tgz --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
