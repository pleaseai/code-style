name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_only:
        description: Skip release-please and publish current package.json versions to npm
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    # Skip the release machinery entirely on a publish_only dispatch — that
    # path republishes the current versions without cutting a new release.
    if: ${{ github.event_name == 'push' || inputs.publish_only != true }}
    runs-on: ubuntu-latest
    outputs:
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
      releases_created: ${{ steps.release.outputs.releases_created }}
      eslint-config-released: ${{ steps.release.outputs['packages/eslint-config--release_created'] }}
      prettier-config-released: ${{ steps.release.outputs['packages/perttier-config--release_created'] }}
      code-style-released: ${{ steps.release.outputs['packages/cli--release_created'] }}
      ast-grep-config-released: ${{ steps.release.outputs['packages/ast-grep-config--release_created'] }}
      editorconfig-released: ${{ steps.release.outputs['packages/editorconfig--release_created'] }}
      bun-lint-config-released: ${{ steps.release.outputs['packages/bun-lint-config--release_created'] }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please bumps package.json but not bun.lock
  # (googleapis/release-please#2689), and `bun pm pack` resolves `workspace:`
  # dependencies from the versions bun.lock recorded. Commit the synced
  # lockfile to the release PR so the release ships it.
  sync-bun-lock:
    needs: release-please
    if: ${{ needs.release-please.outputs.prs_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      # The app token (not GITHUB_TOKEN) so the push re-runs CI on the PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          token: ${{ steps.app-token.outputs.token }}

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - name: Sync bun.lock workspace versions
        run: bun scripts/sync-bun-lock.ts

      - name: Commit bun.lock
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already in sync"
            exit 0
          fi
          USER_ID=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: sync bun.lock workspace versions"
          git push

  publish:
    needs: release-please
    # Run when release-please cut a release, OR on a manual publish_only
    # dispatch (where release-please was skipped). always() lets this job
    # evaluate even though its needs was skipped.
    if: |
      always() &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.publish_only == true) ||
        (needs.release-please.result == 'success' &&
         needs.release-please.outputs.releases_created == 'true')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance / trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs node + bun at the versions pinned in mise.toml
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      # npm CLI is the publisher: bun publish supports neither npm OIDC
      # trusted publishing nor --provenance (oven-sh/bun#22423). Publishing
      # authenticates through OIDC only: id-token: write plus a trusted
      # publisher configured on npmjs.com for each package. No .npmrc auth
      # token is provisioned (no setup-node registry-url / NODE_AUTH_TOKEN), so
      # a package without a trusted publisher fails to publish rather than
      # falling back to a token.

      # OIDC trusted publishing requires npm >= 11.5.1; pin to the latest 11.x
      # in case the runner's bundled npm predates it.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      # Each publish step is independent: !cancelled() keeps the rest running
      # if one package's publish fails (e.g. a first-ever publish that OIDC
      # can't authorize), instead of skipping every later package.
      - name: Publish @pleaseai/eslint-config
        if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.eslint-config-released == 'true') }}
        working-directory: packages/eslint-config
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@pleaseai/eslint-config@$VERSION" version 2>/dev/null; then
            echo "⚠ @pleaseai/eslint-config@$VERSION already published, skipping"
          else
            bun pm pack
            npm publish pleaseai-eslint-config-*.tgz --provenance --access public
          fi

      - name: Publish @pleaseai/prettier-config
        if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.prettier-config-released == 'true') }}
        working-directory: packages/perttier-config
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@pleaseai/prettier-config@$VERSION" version 2>/dev/null; then
            echo "⚠ @pleaseai/prettier-config@$VERSION already published, skipping"
          else
            bun pm pack
            npm publish pleaseai-prettier-config-*.tgz --provenance --access public
          fi

      # No build step: the package ships its .editorconfig as-is.
      - name: Publish @pleaseai/editorconfig
        if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.editorconfig-released == 'true') }}
        working-directory: packages/editorconfig
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@pleaseai/editorconfig@$VERSION" version 2>/dev/null; then
            echo "⚠ @pleaseai/editorconfig@$VERSION already published, skipping"
          else
            bun pm pack
            npm publish pleaseai-editorconfig-*.tgz --provenance --access public
          fi

      # No build step: the package ships its committed lint.toml as-is.
      - name: Publish @pleaseai/bun-lint-config
        if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.bun-lint-config-released == 'true') }}
        working-directory: packages/bun-lint-config
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@pleaseai/bun-lint-config@$VERSION" version 2>/dev/null; then
            echo "⚠ @pleaseai/bun-lint-config@$VERSION already published, skipping"
          else
            bun pm pack
            npm publish pleaseai-bun-lint-config-*.tgz --provenance --access public
          fi

      # No build step: the package ships YAML rules and READMEs as-is.
      - name: Publish @pleaseai/ast-grep-config
        id: publish-ast-grep-config
        if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.ast-grep-config-released == 'true') }}
        working-directory: packages/ast-grep-config
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@pleaseai/ast-grep-config@$VERSION" version 2>/dev/null; then
            echo "⚠ @pleaseai/ast-grep-config@$VERSION already published, skipping"
          else
            bun pm pack
            npm publish pleaseai-ast-grep-config-*.tgz --provenance --access public
          fi

      # Published after @pleaseai/ast-grep-config: the CLI pins that package as a
      # regular dependency, so it must already be on the registry. A failed
      # ast-grep-config publish skips this step rather than ship an
      # uninstallable CLI; a skipped one (not released) does not, so the step
      # also checks the registry: an earlier run's publish may have failed.
      - name: Publish @pleaseai/code-style
        if: ${{ !cancelled() && steps.publish-ast-grep-config.outcome != 'failure' && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.code-style-released == 'true') }}
        working-directory: packages/cli
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@pleaseai/code-style@$VERSION" version 2>/dev/null; then
            echo "⚠ @pleaseai/code-style@$VERSION already published, skipping"
          else
            CONFIG_VERSION=$(node -p "require('../ast-grep-config/package.json').version")
            if [ -z "$(npm view "@pleaseai/ast-grep-config@$CONFIG_VERSION" version 2>/dev/null)" ]; then
              echo "::error::@pleaseai/ast-grep-config@$CONFIG_VERSION is not on the registry; not publishing a CLI that depends on it"
              exit 1
            fi
            bun pm pack
            npm publish pleaseai-code-style-*.tgz --provenance --access public
          fi
