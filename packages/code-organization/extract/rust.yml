# Layer-3 extraction rules (ADR-0022 §3) for Rust. Run by `please-code-org
# check` with `ast-grep scan -r`; never part of the consumer-facing rule set.
#
# Out-of-line module declarations (`mod name;`), optionally with a preceding
# `#[path = "…"]` attribute captured as $PATH. Declarations nested in an
# inline `mod x { … }` block or a function body are not extracted.
id: mod-decl
language: rust
severity: hint
message: module declaration
rule:
  kind: identifier
  inside:
    field: name
    kind: mod_item
    not:
      has:
        field: body
        kind: declaration_list
    inside:
      kind: source_file
    any:
      - follows:
          stopBy:
            not:
              any:
                - kind: attribute_item
                - kind: line_comment
                - kind: block_comment
          kind: attribute_item
          has:
            kind: attribute
            all:
              - has:
                  kind: identifier
                  regex: ^path$
              - has:
                  field: value
                  kind: string_literal
                  has:
                    kind: string_content
                    pattern: $PATH
      # No `#[path]`: still a declaration (first branch wins when it matches).
      - kind: mod_item
---
id: test-attr
language: rust
severity: hint
message: test function attribute
rule:
  kind: attribute_item
  regex: ^#\[\s*(\w+::)*test\s*(\(|\])
