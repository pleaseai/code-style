# Layer-3 extraction rules (ADR-0022 §3) for Java. Run by `please-code-org
# check` with `ast-grep scan -r`; never part of the consumer-facing rule set.
id: helper-candidate
language: java
severity: hint
message: test helper candidate
rule:
  kind: identifier
  regex: ^([cC]reateMock|[mM]ock|[fF]ake|[sS]tub)([A-Z0-9_]|$)
  inside:
    field: name
    any:
      - kind: class_declaration
      - kind: interface_declaration
      - kind: record_declaration
      - kind: enum_declaration
    inside:
      kind: program
---
id: import
language: java
severity: hint
message: import
rule:
  kind: import_declaration
---
id: package
language: java
severity: hint
message: package
rule:
  any:
    - kind: scoped_identifier
    - kind: identifier
  inside:
    kind: package_declaration
