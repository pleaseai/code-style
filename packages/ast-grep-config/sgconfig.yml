# ast-grep project config for @pleaseai/ast-grep-config (ADR-0022, layer 2).
#
# Consumers can scan with this file directly:
#   ast-grep scan -c node_modules/@pleaseai/ast-grep-config/sgconfig.yml
# or point their own sgconfig.yml `ruleDirs` at
# `node_modules/@pleaseai/ast-grep-config/rules`.
#
# `extract/` holds the layer-3 extraction rules `please-style check` runs; it is
# deliberately not listed in `ruleDirs` so it never reaches consumer output.
ruleDirs:
  - rules
testConfigs:
  - testDir: rule-tests
