id: rust-error-outside-error-file
valid:
  - 'pub struct User { name: String }'
  - 'impl fmt::Display for User { fn fmt(&self, f: &mut fmt::Formatter<''_>) -> fmt::Result { Ok(()) } }'
  - 'impl From<io::Error> for Wrapper { fn from(e: io::Error) -> Self { Wrapper } }'
  - |
    #[derive(Debug, Clone)]
    pub enum Mode { A, B }
invalid:
  - 'pub struct ParseError { line: usize }'
  - pub enum Error { Io(std::io::Error) }
  - impl std::error::Error for Failure {}
  - impl Error for Failure {}
  - |
    #[derive(Debug, thiserror::Error)]
    pub enum Failure { #[error("io")] Io }
  - |
    /// Something went wrong.
    #[derive(Debug, Error)]
    #[non_exhaustive]
    pub enum Failure { Io }
