id: dart-error-outside-errors-file
language: dart
severity: warning
message: >-
  [code-error-types-in-dedicated-module] Error/exception type declared outside
  the library's errors.dart. Move it there. Fix guide:
  node_modules/@pleaseai/ast-grep-config/rules/dart/dart-error-outside-errors-file.md
note: >-
  Move the class into `errors.dart` in the same directory (create it if
  missing) and import or export it from there.
url: https://github.com/pleaseai/code-style/blob/main/packages/ast-grep-config/rules/dart/dart-error-outside-errors-file.md
rule:
  kind: class_declaration
  any:
    # `extends FooError` / `extends AppException`
    - has:
        field: superclass
        has:
          field: type
          regex: (Error|Exception)(<.*>)?$
    # `implements Exception` (the Dart idiom) or `implements AppError`
    - has:
        field: interfaces
        has:
          kind: type
          regex: (Error|Exception)(<.*>)?$
    # No type information: a class *named* like an error that has a supertype.
    - all:
        - has:
            field: name
            regex: (Error|Exception)$
        - any:
            - has: {field: superclass, kind: superclass}
            - has: {field: interfaces, kind: interfaces}
ignores:
  - '**/errors.dart'
  - '**/*_test.dart'
  - '**/test/**'
  - '**/integration_test/**'
  - '**/test_driver/**'
