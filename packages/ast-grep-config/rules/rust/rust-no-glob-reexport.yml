id: rust-no-glob-reexport
language: rust
severity: warning
message: >-
  [code-greppable-public-symbols] Glob re-export hides which names this module
  exposes. List the re-exported items explicitly. Fix guide:
  node_modules/@pleaseai/ast-grep-config/rules/rust/rust-no-glob-reexport.md
note: >-
  Replace `pub use path::*;` with `pub use path::{Foo, Bar};` naming every item
  callers use. `cargo check` lists the names that go missing.
url: https://github.com/pleaseai/code-style/blob/main/packages/ast-grep-config/rules/rust/rust-no-glob-reexport.md
rule:
  kind: use_declaration
  all:
    # Any visibility (`pub`, `pub(crate)`, `pub(super)`) makes it a re-export;
    # a private `use x::*;` (e.g. `use super::*;` in tests) is not matched.
    - has:
        kind: visibility_modifier
    - has:
        stopBy: end
        kind: use_wildcard
