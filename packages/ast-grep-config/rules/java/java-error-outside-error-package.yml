id: java-error-outside-error-package
language: java
severity: warning
message: >-
  [code-error-types-in-dedicated-module] Exception type declared outside an
  `error` package. Move it into the module's error package. Fix guide:
  node_modules/@pleaseai/ast-grep-config/rules/java/java-error-outside-error-package.md
note: >-
  Move the file to `<module package>/error/` (for example
  `com/acme/billing/error/InvoiceNotFoundException.java`), update its
  `package` line, and fix the imports of its users.
url: https://github.com/pleaseai/code-style/blob/main/packages/ast-grep-config/rules/java/java-error-outside-error-package.md
rule:
  kind: class_declaration
  any:
    # `extends AppException`, `extends RuntimeException`, `extends Throwable`
    - has:
        field: superclass
        regex: (Error|Exception|Throwable)(<.*>)?$
    # No type information: a class *named* like an error that has a superclass.
    - all:
        - has:
            field: name
            regex: (Error|Exception)$
        - has:
            field: superclass
            kind: superclass
ignores:
  - '**/error/**'
  - '**/src/test/**'
  - '**/src/testFixtures/**'
