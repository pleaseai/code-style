# mise.toml — single source of tool versions (replaces .nvmrc)
# Setup: `mise trust && mise install`
# Keep `bun` in sync with `packageManager` in package.json (Turborepo requires that field).

[tools]
node = "24"
bun = "1.3.14"

[tasks.build]
description = "Build all packages"
run = "bun run build"

[tasks.lint]
description = "Lint the repo"
run = "bun run lint"

[tasks."lint:fix"]
description = "Lint with auto-fix"
run = "bun run lint:fix"

[tasks."docs:dev"]
description = "Run the docs dev server"
run = "bun run docs:dev"
